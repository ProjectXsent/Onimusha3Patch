[Display]
; Mode:
;   windowed   - normal window with a title bar
;   borderless - borderless window covering the screen (recommended)
;   fullscreen  - true exclusive fullscreen
Mode=borderless

; Back buffer resolution. 0 = use the desktop resolution
; (windowed mode uses 1280x720 when 0).
; In borderless mode the window always covers the whole screen and the
; picture is stretched if this is lower than the desktop resolution.
Width=0
Height=0

; Aspect Ratio = "4:3" or "stretched" to go back to the old behavior
AspectRatio=4:3

; Exclusive mode only. 0 = use the desktop refresh rate.
RefreshRate=0

; 0 = normal cursor (default), 1 = hide it over the game
HideCursor=1

[Debug]
Log=0